[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paretopilot-real"
version = "0.2.0"
description = "Correctness-gated, budget-aware HLS repair and Pareto optimisation agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "coverage>=7"]

[project.scripts]
paretopilot = "paretopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

